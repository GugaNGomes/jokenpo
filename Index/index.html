<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>

    <title>JOKENPÔ - Inicio</title>
  </head>
  <body>
    <div class="img">
      <img class="Lateral" src="../PEDRA D.png" alt="" />
      <img class="Centro" src="../PAPEL D.png" alt="" />
      <img class="Lateral" src="../TESOURA D.png" alt="" />
    </div>
    <div class="jogos">
      <a href="../NovoJogo/novo.html"><b>NOVO JOGO</b></a>
      <span id="multiplayer-link"></span>
    </div>
    <script>
      function isDesktop() {
        // Detecta se não é mobile/tablet
        return !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
          navigator.userAgent
        );
      }
      if (isDesktop()) {
        document.getElementById("multiplayer-link").innerHTML =
          '<a href="../multiplayer/multi.html"><b>MULTIPLAYER</b></a>';
      }
    </script>
  </body>
</html>
